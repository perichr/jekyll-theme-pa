title: "Dev:P"
description: "My code, my life."

author:
  name: ":P"
  github: perichr
  email: "i@perichr.org"
  url: "https://perichr.org"

style:
  layout: "simp"
  theme: "dash"

nav:
  - text: "categoris"
    title: "分类"
    href: "/categories"
  - text: "tags"
    title: "标签"
    href: "/tags"
  - text: "archives"
    title: "文章存档"
    href: "/archives"
  - text: "gh"
    title: "@Github"
    href: "https://github.com/perichr"
  - text: "sf"
    title: "@SegmentFault"
    href: "https://segmentfault.com/u/perichr"

kramdown:
  input: GFM
  syntax_highlighter: rouge

comment:
  output: true
  service: "disqus"
  giscus: |
    data-repo="perichr/perichr.github.io"
    data-repo-id="MDEwOlJlcG9zaXRvcnk1MzA1NjEzMA=="
    data-category="Announcements"
    data-category-id="DIC_kwDOAymSgs4C9qgf"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="zh-CN"
    crossorigin="anonymous"
  disqus: "perichr"

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /post/:year/:month/:day/:title

paginate: 8
paginate_path: /index/:num

sass:
  style: compressed

collections:
  pages:
    output: true
    permalink: /:path

defaults:
  - scope:
      path: "posts"
    values:
      layout: "post"
  - scope:
      path: "pages"
    values:
      layout: "page"
